<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    .s { fill: none; stroke: #E8692A; stroke-linecap: round; stroke-linejoin: round; }
    .f { fill: #E8692A; stroke: none; }
    .fd { fill: #E8692A; opacity: 0.2; stroke: none; }
    .fm { fill: #E8692A; opacity: 0.5; stroke: none; }
  </style>

  <!-- terrain -->
  <polyline points="8,80 25,74 42,78 60,70 80,76 92,72" class="s" stroke-width="1.8"/>
  <path d="M8,80 L25,74 L42,78 L60,70 L80,76 L92,72 L92,95 L8,95 Z" class="fd"/>

  <!-- rover body -->
  <rect x="28" y="52" width="38" height="20" rx="5" class="s" stroke-width="2.2"/>
  <rect x="28" y="52" width="38" height="20" rx="5" class="fd"/>

  <!-- solar panel top -->
  <rect x="22" y="42" width="22" height="10" rx="2" class="s" stroke-width="1.8"/>
  <!-- solar panel lines -->
  <line x1="29" y1="42" x2="29" y2="52" class="s" stroke-width="1"/>
  <line x1="36" y1="42" x2="36" y2="52" class="s" stroke-width="1"/>
  <!-- solar panel 2 -->
  <rect x="50" y="42" width="16" height="10" rx="2" class="s" stroke-width="1.8"/>
  <line x1="57" y1="42" x2="57" y2="52" class="s" stroke-width="1"/>

  <!-- camera mast -->
  <line x1="58" y1="52" x2="58" y2="36" class="s" stroke-width="2"/>
  <!-- camera head -->
  <rect x="55" y="30" width="10" height="7" rx="2" class="s" stroke-width="1.8"/>
  <circle cx="58" cy="33.5" r="2" class="s" stroke-width="1.2"/>
  <circle cx="58" cy="33.5" r="0.8" class="f"/>

  <!-- front wheels -->
  <circle cx="32" cy="74" r="8" class="s" stroke-width="2"/>
  <circle cx="32" cy="74" r="4" class="s" stroke-width="1.2"/>
  <circle cx="32" cy="74" r="1.5" class="f"/>
  <!-- spokes -->
  <line x1="32" y1="66" x2="32" y2="82" class="s" stroke-width="1"/>
  <line x1="24" y1="74" x2="40" y2="74" class="s" stroke-width="1"/>
  <line x1="26.3" y1="68.3" x2="37.7" y2="79.7" class="s" stroke-width="1"/>
  <line x1="37.7" y1="68.3" x2="26.3" y2="79.7" class="s" stroke-width="1"/>

  <!-- rear wheels -->
  <circle cx="63" cy="74" r="8" class="s" stroke-width="2"/>
  <circle cx="63" cy="74" r="4" class="s" stroke-width="1.2"/>
  <circle cx="63" cy="74" r="1.5" class="f"/>
  <line x1="63" y1="66" x2="63" y2="82" class="s" stroke-width="1"/>
  <line x1="55" y1="74" x2="71" y2="74" class="s" stroke-width="1"/>
  <line x1="57.3" y1="68.3" x2="68.7" y2="79.7" class="s" stroke-width="1"/>
  <line x1="68.7" y1="68.3" x2="57.3" y2="79.7" class="s" stroke-width="1"/>

  <!-- signal waves from antenna -->
  <path d="M63,36 Q67,33 63,30" class="s" stroke-width="1.2" fill="none"/>
  <path d="M63,36 Q71,31 63,26" class="s" stroke-width="1" fill="none" opacity="0.6"/>
</svg>
