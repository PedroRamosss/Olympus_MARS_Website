<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    .s { fill: none; stroke: #E8692A; stroke-linecap: round; stroke-linejoin: round; }
    .f { fill: #E8692A; stroke: none; }
    .fd { fill: #E8692A; opacity: 0.15; stroke: none; }
    .fm { fill: #E8692A; opacity: 0.45; stroke: none; }
  </style>

  <!-- radar sweep area (filled wedge) -->
  <path d="M50,50 L50,14 A36,36 0 0,1 82,68 Z" class="fd"/>

  <!-- concentric radar rings -->
  <circle cx="50" cy="50" r="36" class="s" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="24" class="s" stroke-width="1.2"/>
  <circle cx="50" cy="50" r="12" class="s" stroke-width="1"/>

  <!-- crosshairs -->
  <line x1="50" y1="14" x2="50" y2="86" class="s" stroke-width="0.8" stroke-dasharray="3,4"/>
  <line x1="14" y1="50" x2="86" y2="50" class="s" stroke-width="0.8" stroke-dasharray="3,4"/>

  <!-- sweep arm -->
  <line x1="50" y1="50" x2="82" y2="34" class="s" stroke-width="2"/>

  <!-- blip / detected probe -->
  <circle cx="71" cy="33" r="4" class="fm"/>
  <circle cx="71" cy="33" r="2" class="f"/>
  <!-- blip ring pulse -->
  <circle cx="71" cy="33" r="7" class="s" stroke-width="1" opacity="0.5"/>

  <!-- secondary blip faint -->
  <circle cx="38" cy="62" r="2.5" class="s" stroke-width="1" opacity="0.4"/>

  <!-- center -->
  <circle cx="50" cy="50" r="3" class="f"/>
  <circle cx="50" cy="50" r="6" class="s" stroke-width="1.5"/>
</svg>
