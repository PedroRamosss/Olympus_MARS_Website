<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    .s { fill: none; stroke: #E8692A; stroke-linecap: round; stroke-linejoin: round; }
    .f { fill: #E8692A; stroke: none; }
    .fd { fill: #E8692A; opacity: 0.18; stroke: none; }
    .fm { fill: #E8692A; opacity: 0.5; stroke: none; }
  </style>

  <!-- ground surface -->
  <path d="M8,78 Q25,73 38,76 Q52,79 65,73 Q78,67 92,71" class="s" stroke-width="2"/>
  <path d="M8,78 Q25,73 38,76 Q52,79 65,73 Q78,67 92,71 L92,95 L8,95 Z" class="fd"/>
  <!-- surface pebbles -->
  <ellipse cx="22" cy="81" rx="3" ry="1.5" class="fm"/>
  <ellipse cx="75" cy="76" rx="2.5" ry="1.2" class="fm"/>
  <ellipse cx="55" cy="80" rx="2" ry="1" class="fm"/>

  <!-- arm base mount -->
  <rect x="43" y="14" width="14" height="11" rx="3" class="s" stroke-width="2"/>
  <line x1="48" y1="14" x2="48" y2="25" class="s" stroke-width="1"/>
  <line x1="52" y1="14" x2="52" y2="25" class="s" stroke-width="1"/>

  <!-- upper arm segment -->
  <line x1="50" y1="25" x2="50" y2="46" class="s" stroke-width="3"/>
  <line x1="47" y1="30" x2="53" y2="30" class="s" stroke-width="1"/>
  <line x1="47" y1="38" x2="53" y2="38" class="s" stroke-width="1"/>

  <!-- elbow joint -->
  <circle cx="50" cy="46" r="5" class="s" stroke-width="2"/>
  <circle cx="50" cy="46" r="2" class="f"/>

  <!-- lower arm angled -->
  <line x1="50" y1="51" x2="34" y2="65" class="s" stroke-width="2.5"/>
  <circle cx="42" cy="58" r="1.8" class="s" stroke-width="1.2"/>

  <!-- wrist joint -->
  <circle cx="34" cy="65" r="4" class="s" stroke-width="1.8"/>
  <circle cx="34" cy="65" r="1.5" class="f"/>

  <!-- scoop tool -->
  <path d="M22,65 L46,65 L46,74 Q34,80 22,74 Z" class="s" stroke-width="2"/>
  <path d="M22,65 L46,65 L46,74 Q34,80 22,74 Z" class="fd"/>
  <line x1="22" y1="68" x2="46" y2="68" class="s" stroke-width="1"/>
  <!-- collected regolith -->
  <ellipse cx="29" cy="72" rx="3" ry="2" class="fm"/>
  <ellipse cx="36" cy="73" rx="2.5" ry="1.8" class="fm"/>
  <ellipse cx="42" cy="71" rx="2" ry="1.5" class="fm"/>
  <!-- dust particles -->
  <circle cx="25" cy="63" r="1" class="fm"/>
  <circle cx="48" cy="62" r="0.8" class="fm"/>
  <circle cx="34" cy="61" r="1.1" class="fm"/>

  <!-- sample tube right side -->
  <rect x="62" y="38" width="10" height="22" rx="3" class="s" stroke-width="1.8"/>
  <rect x="61" y="34" width="12" height="6" rx="2" class="s" stroke-width="1.5"/>
  <line x1="62" y1="48" x2="72" y2="48" class="s" stroke-width="1"/>
  <rect x="64" y="50" width="6" height="8" rx="1" class="fm"/>
</svg>
