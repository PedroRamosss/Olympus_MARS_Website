<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    .s { fill: none; stroke: #E8692A; stroke-linecap: round; stroke-linejoin: round; }
    .f { fill: #E8692A; stroke: none; }
    .fd { fill: #E8692A; opacity: 0.18; stroke: none; }
    .fm { fill: #E8692A; opacity: 0.45; stroke: none; }
  </style>

  <!-- ground layers -->
  <rect x="10" y="46" width="80" height="12" rx="1" class="fd"/>
  <rect x="10" y="60" width="80" height="12" rx="1" class="fd" opacity="0.25"/>
  <rect x="10" y="74" width="80" height="14" rx="1" class="fd" opacity="0.35"/>
  <!-- layer lines -->
  <line x1="10" y1="46" x2="90" y2="46" class="s" stroke-width="1"/>
  <line x1="10" y1="58" x2="90" y2="58" class="s" stroke-width="1"/>
  <line x1="10" y1="70" x2="90" y2="70" class="s" stroke-width="1"/>
  <line x1="10" y1="82" x2="90" y2="82" class="s" stroke-width="1"/>
  <!-- layer texture dots -->
  <circle cx="22" cy="52" r="1.5" class="fm"/>
  <circle cx="30" cy="64" r="1.2" class="fm"/>
  <circle cx="70" cy="52" r="1.5" class="fm"/>
  <circle cx="78" cy="76" r="1.3" class="fm"/>

  <!-- drill motor housing top -->
  <rect x="38" y="10" width="24" height="14" rx="4" class="s" stroke-width="2"/>
  <!-- motor bolts -->
  <circle cx="43" cy="17" r="2" class="s" stroke-width="1.2"/>
  <circle cx="57" cy="17" r="2" class="s" stroke-width="1.2"/>
  <!-- drill shaft -->
  <rect x="47" y="24" width="6" height="22" rx="1" class="s" stroke-width="2"/>
  <!-- shaft ribbing -->
  <line x1="47" y1="29" x2="53" y2="29" class="s" stroke-width="1"/>
  <line x1="47" y1="35" x2="53" y2="35" class="s" stroke-width="1"/>
  <line x1="47" y1="41" x2="53" y2="41" class="s" stroke-width="1"/>
  <!-- drill bit head -->
  <polygon points="44,46 56,46 54,56 50,60 46,56" class="s" stroke-width="2" fill="none"/>
  <polygon points="44,46 56,46 54,56 50,60 46,56" class="fm"/>
  <!-- flutes/cutting edges -->
  <line x1="50" y1="46" x2="50" y2="60" class="s" stroke-width="1"/>
  <line x1="44" y1="50" x2="56" y2="50" class="s" stroke-width="1"/>
  <!-- drill tip -->
  <line x1="50" y1="60" x2="50" y2="88" class="s" stroke-width="2.5"/>
  <!-- helical flute marks on drill rod -->
  <line x1="47" y1="65" x2="53" y2="70" class="s" stroke-width="1"/>
  <line x1="47" y1="73" x2="53" y2="78" class="s" stroke-width="1"/>
  <!-- depth arrow indicators -->
  <line x1="30" y1="46" x2="30" y2="82" class="s" stroke-width="1" stroke-dasharray="2,3"/>
  <polygon points="27,80 30,88 33,80" class="f"/>
</svg>
