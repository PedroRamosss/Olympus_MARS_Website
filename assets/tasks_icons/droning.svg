<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    .s { fill: none; stroke: #E8692A; stroke-linecap: round; stroke-linejoin: round; }
    .f { fill: #E8692A; stroke: none; }
    .fd { fill: #E8692A; opacity: 0.2; stroke: none; }
  </style>

  <!-- arm NW -->
  <line x1="50" y1="50" x2="24" y2="28" class="s" stroke-width="2.5"/>
  <!-- arm NE -->
  <line x1="50" y1="50" x2="76" y2="28" class="s" stroke-width="2.5"/>
  <!-- arm SW -->
  <line x1="50" y1="50" x2="24" y2="72" class="s" stroke-width="2.5"/>
  <!-- arm SE -->
  <line x1="50" y1="50" x2="76" y2="72" class="s" stroke-width="2.5"/>

  <!-- motor mounts -->
  <circle cx="24" cy="28" r="5" class="s" stroke-width="1.8"/>
  <circle cx="76" cy="28" r="5" class="s" stroke-width="1.8"/>
  <circle cx="24" cy="72" r="5" class="s" stroke-width="1.8"/>
  <circle cx="76" cy="72" r="5" class="s" stroke-width="1.8"/>

  <!-- propeller blades NW -->
  <ellipse cx="24" cy="28" rx="11" ry="3.5" class="s" stroke-width="1.5" transform="rotate(-30,24,28)"/>
  <ellipse cx="24" cy="28" rx="11" ry="3.5" class="s" stroke-width="1.5" transform="rotate(60,24,28)"/>
  <!-- propeller blades NE -->
  <ellipse cx="76" cy="28" rx="11" ry="3.5" class="s" stroke-width="1.5" transform="rotate(30,76,28)"/>
  <ellipse cx="76" cy="28" rx="11" ry="3.5" class="s" stroke-width="1.5" transform="rotate(-60,76,28)"/>
  <!-- propeller blades SW -->
  <ellipse cx="24" cy="72" rx="11" ry="3.5" class="s" stroke-width="1.5" transform="rotate(30,24,72)"/>
  <ellipse cx="24" cy="72" rx="11" ry="3.5" class="s" stroke-width="1.5" transform="rotate(-60,24,72)"/>
  <!-- propeller blades SE -->
  <ellipse cx="76" cy="72" rx="11" ry="3.5" class="s" stroke-width="1.5" transform="rotate(-30,76,72)"/>
  <ellipse cx="76" cy="72" rx="11" ry="3.5" class="s" stroke-width="1.5" transform="rotate(60,76,72)"/>

  <!-- body -->
  <rect x="40" y="42" width="20" height="16" rx="4" class="s" stroke-width="2"/>
  <!-- camera lens -->
  <circle cx="50" cy="58" r="3" class="s" stroke-width="1.5"/>
  <circle cx="50" cy="58" r="1.2" class="f"/>
  <!-- center dot -->
  <circle cx="50" cy="50" r="3" class="f"/>

  <!-- altitude dashed line -->
  <line x1="50" y1="64" x2="50" y2="82" class="s" stroke-width="1" stroke-dasharray="2,3"/>
  <!-- ground marker -->
  <line x1="42" y1="84" x2="58" y2="84" class="s" stroke-width="1.5"/>
  <line x1="44" y1="87" x2="56" y2="87" class="s" stroke-width="1"/>
  <line x1="46" y1="90" x2="54" y2="90" class="s" stroke-width="0.8"/>
</svg>
