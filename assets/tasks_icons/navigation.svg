<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    .s { fill: none; stroke: #E8692A; stroke-linecap: round; stroke-linejoin: round; }
    .f { fill: #E8692A; stroke: none; }
    .fd { fill: #E8692A; opacity: 0.25; stroke: none; }
  </style>

  <!-- outer ring -->
  <circle cx="50" cy="50" r="38" class="s" stroke-width="2"/>
  <!-- tick marks at cardinal -->
  <line x1="50" y1="12" x2="50" y2="18" class="s" stroke-width="2"/>
  <line x1="50" y1="82" x2="50" y2="88" class="s" stroke-width="2"/>
  <line x1="12" y1="50" x2="18" y2="50" class="s" stroke-width="2"/>
  <line x1="82" y1="50" x2="88" y2="50" class="s" stroke-width="2"/>
  <!-- diagonal ticks -->
  <line x1="23" y1="23" x2="27" y2="27" class="s" stroke-width="1.2"/>
  <line x1="73" y1="23" x2="77" y2="27" class="s" stroke-width="1.2"/>
  <line x1="23" y1="77" x2="27" y2="73" class="s" stroke-width="1.2"/>
  <line x1="73" y1="77" x2="77" y2="73" class="s" stroke-width="1.2"/>
  <!-- inner dashed ring -->
  <circle cx="50" cy="50" r="24" class="s" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- North needle (filled orange) -->
  <polygon points="50,22 54,50 50,46 46,50" class="f"/>
  <!-- South needle (dimmed) -->
  <polygon points="50,78 54,50 50,54 46,50" class="fd"/>
  <!-- center hub -->
  <circle cx="50" cy="50" r="4.5" class="s" stroke-width="2"/>
  <circle cx="50" cy="50" r="2" class="f"/>
  <!-- N label -->
  <text x="50" y="10" font-family="sans-serif" font-size="7" font-weight="700" fill="#E8692A" text-anchor="middle">N</text>
</svg>
