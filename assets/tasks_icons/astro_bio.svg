<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    .s { fill: none; stroke: #E8692A; stroke-linecap: round; stroke-linejoin: round; }
    .f { fill: #E8692A; stroke: none; }
    .fd { fill: #E8692A; opacity: 0.18; stroke: none; }
    .fm { fill: #E8692A; opacity: 0.5; stroke: none; }
  </style>

  <!-- DNA double helix left strand -->
  <path d="M36,12 C30,20 30,28 36,36 C42,44 42,52 36,60 C30,68 30,76 36,84" class="s" stroke-width="2.2" fill="none"/>
  <!-- DNA double helix right strand -->
  <path d="M64,12 C70,20 70,28 64,36 C58,44 58,52 64,60 C70,68 70,76 64,84" class="s" stroke-width="2.2" fill="none"/>

  <!-- crossbars / base pairs -->
  <line x1="36" y1="18" x2="64" y2="18" class="s" stroke-width="1.8"/>
  <line x1="33" y1="26" x2="67" y2="26" class="s" stroke-width="1.5"/>
  <line x1="36" y1="34" x2="64" y2="34" class="s" stroke-width="1.8"/>
  <line x1="40" y1="42" x2="60" y2="42" class="s" stroke-width="1.5"/>
  <line x1="40" y1="50" x2="60" y2="50" class="s" stroke-width="1.8"/>
  <line x1="40" y1="58" x2="60" y2="58" class="s" stroke-width="1.5"/>
  <line x1="36" y1="66" x2="64" y2="66" class="s" stroke-width="1.8"/>
  <line x1="33" y1="74" x2="67" y2="74" class="s" stroke-width="1.5"/>
  <line x1="36" y1="82" x2="64" y2="82" class="s" stroke-width="1.8"/>

  <!-- base pair node dots -->
  <circle cx="36" cy="18" r="2.5" class="f"/>
  <circle cx="64" cy="18" r="2.5" class="fm"/>
  <circle cx="36" cy="34" r="2.5" class="fm"/>
  <circle cx="64" cy="34" r="2.5" class="f"/>
  <circle cx="40" cy="50" r="2.5" class="f"/>
  <circle cx="60" cy="50" r="2.5" class="fm"/>
  <circle cx="36" cy="66" r="2.5" class="fm"/>
  <circle cx="64" cy="66" r="2.5" class="f"/>
  <circle cx="36" cy="82" r="2.5" class="f"/>
  <circle cx="64" cy="82" r="2.5" class="fm"/>

  <!-- atom orbit rings around center -->
  <ellipse cx="50" cy="48" rx="14" ry="5" class="s" stroke-width="1" opacity="0.4" transform="rotate(60,50,48)"/>
  <ellipse cx="50" cy="48" rx="14" ry="5" class="s" stroke-width="1" opacity="0.4" transform="rotate(-60,50,48)"/>
  <!-- nucleus -->
  <circle cx="50" cy="48" r="3.5" class="f"/>
</svg>
